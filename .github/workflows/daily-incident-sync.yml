name: Sync Saudi Maritime & Pipeline Incident Log

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-incidents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update incident log from GDELT 2.0 DOC API
        run: python3 -u scripts/update_incident_log.py
      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Data-Spreadsheets/Recent-Saudi-Maritime-Pipeline-Incidents.csv
          git diff --staged --quiet || (git commit -m "Auto-sync Saudi pipeline/port/tanker incident log" && git push)
